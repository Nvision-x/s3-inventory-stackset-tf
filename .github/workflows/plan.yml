name: 'S3 Inventory (Plan Only)'

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    name: 'Discover Accounts'
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.scan.outputs.configs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan accounts config
        id: scan
        shell: bash
        run: |
          echo "Reading accounts from accounts.json"
          if [ ! -f accounts.json ]; then
            echo "accounts.json not found"
            exit 1
          fi

          RAW=$(cat accounts.json)
          ACCOUNTS=$(echo "$RAW" | jq -c 'if has("accounts") then .accounts else . end')

          echo "$ACCOUNTS" | jq -e 'if type=="array" then . else empty end' > /dev/null \
            || { echo "accounts.json must be an array or have an 'accounts' array"; exit 1; }

          total=$(echo "$ACCOUNTS" | jq 'length')
          echo "Total accounts found: $total"
          echo "$ACCOUNTS" | jq -r '.[] | "  \(.account_id) (OIDC Role: \(.oidc_role))"'

          echo "configs=$(echo "$ACCOUNTS" | jq -c '.')" >> "$GITHUB_OUTPUT"

  plan:
    name: 'Plan for ${{ matrix.config.account_id }}'
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
      max-parallel: 5
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ matrix.config.account_id }}:role/${{ matrix.config.oidc_role }}
          role-session-name: GitHubActions-S3Inventory-Plan
          aws-region: ${{ matrix.config.aws_region || 'us-east-1' }}

      - name: Verify AWS access
        shell: bash
        run: |
          echo "Authenticated to account ${{ matrix.config.account_id }}"
          aws sts get-caller-identity

      - name: Generate backend config and overrides
        id: generate-configs
        shell: bash
        run: |
          CONFIG='${{ toJson(matrix.config) }}'

          backend_file="backend-${{ matrix.config.account_id }}.tfbackend"

          # Render backend config
          echo "$CONFIG" | jq -r '
            .terraform_backend
            | to_entries[]
            | if (.value | type) == "string"
              then "\(.key) = \"\(.value)\""
              else "\(.key) = \(.value)"
              end
          ' > "$backend_file"

          echo "Generated backend config:"
          cat "$backend_file"

          # Build overrides.auto.tfvars.json from overrides + aws_region
          aws_region=$(echo "$CONFIG" | jq -r '.aws_region // ""')
          echo "$CONFIG" | jq --arg r "$aws_region" '
            (.overrides // {}) +
            (if $r != "" then {"aws_region": $r} else {} end)
          ' > overrides.auto.tfvars.json

          echo "Generated overrides:"
          cat overrides.auto.tfvars.json

          echo "backend_file=$backend_file" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform
        shell: bash
        run: |
          terraform init -backend-config="${{ steps.generate-configs.outputs.backend_file }}" -reconfigure

      - name: Terraform Plan
        shell: bash
        run: |
          terraform plan

  summary:
    name: 'Summary'
    needs: [discover, plan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        shell: bash
        run: |
          echo "# S3 Inventory Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          configs='${{ needs.discover.outputs.configs }}'
          total=$(echo "$configs" | jq '. | length')

          echo "**Total Accounts:** $total" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Plan Only (PR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Planned Accounts" >> $GITHUB_STEP_SUMMARY
          echo "$configs" | jq -r '.[] | "- \(.account_id) (Role: \(.oidc_role))"' >> $GITHUB_STEP_SUMMARY
